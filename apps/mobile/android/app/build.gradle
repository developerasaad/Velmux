apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Release engineering:
 * - Version metadata is deterministic and injectable from CI
 *   (-PvelmuxVersionName / -PvelmuxVersionCode); defaults mark the current
 *   release candidate.
 * - R8 runs on release builds; app-specific keeps live in
 *   proguard-rules.pro (JNI facade + TurboModule codegen contracts).
 * - Release signing consumes a CI-provided keystore via
 *   -PvelmuxSigning* properties. When absent, the build falls back to the
 *   debug keystore: the artifact is a REAL release build (R8-minified,
 *   non-debuggable) that is test-signable — documented, never hidden.
 */
def enableProguardInReleaseBuilds = true

def releaseVersionName = (project.findProperty('velmuxVersionName') ?: '0.1.0-rc.1').toString()
def releaseVersionCode = (project.findProperty('velmuxVersionCode') ?: '1').toString().toInteger()

def releaseKeystoreFile = project.findProperty('velmuxSigningKeystore')
def releaseKeystorePassword = project.findProperty('velmuxSigningStorePassword')
def releaseKeyAlias = project.findProperty('velmuxSigningKeyAlias')
def releaseKeyPassword = project.findProperty('velmuxSigningKeyPassword')
def hasReleaseSigning = releaseKeystoreFile != null && releaseKeystorePassword != null &&
        releaseKeyAlias != null && releaseKeyPassword != null

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.velmux.mobile"
    defaultConfig {
        applicationId "com.velmux.mobile"
        // Velmux product floor: Android 10 / API 29 (docs/DECISIONS.md D-003).
        minSdkVersion 29
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode releaseVersionCode
        versionName releaseVersionName
        // The pinned FFmpeg artifacts (tools/ffmpeg-builder/build-android.sh)
        // cover exactly these ABIs. Without the filter the NDK default set
        // would also build 32-bit x86, silently shipping an engine without
        // the FFmpeg backend there. -PvelmuxAbis=x86_64 narrows the set for
        // the emulator CI (only the device's ABI is exercised there, which
        // cuts the native build to a third); the default stays the full set.
        def velmuxAbiList = (project.findProperty('velmuxAbis')
            ?: 'armeabi-v7a,arm64-v8a,x86_64').split(',').collect { it.trim() }
        ndk {
            abiFilters velmuxAbiList
        }
        // The instrumented tests are JUnit4 (@RunWith(AndroidJUnit4)). AGP's
        // default runner (android.test.InstrumentationTestRunner) cannot
        // discover them and connectedDebugAndroidTest would report an empty
        // test run, so point it at the androidx runner explicitly.
        testInstrumentationRunner "androidx.test.runner.AndroidJUnit4Runner"
        externalNativeBuild {
            cmake {
                arguments "-DVELMUX_FFMPEG_ANDROID_PREFIX=${project.findProperty('velmuxFFmpegPrefix') ?: ''}"
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystoreFile)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // CI-provided release keystore when configured; otherwise the
            // debug keystore signs a genuinely release-built artifact
            // (test-signable, never presented as store-signed).
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
    // Instrumented tests (device/emulator): REAL MediaCodec conversions
    // through the engine's bridge facade (Milestone 1 validation).
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test:rules:1.6.1"
}
