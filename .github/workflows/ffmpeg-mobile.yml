# Heavy FFmpeg cross-compilation for mobile platforms through the
# repository build script. Produces the native FFmpeg artifacts under
# tools/ffmpeg-builder/out; consumers restore them from identity-keyed
# actions/cache entries (see android.yml / ios.yml / release.yml), so the
# run artifacts uploaded here serve inspection and manual debugging.
#
# Heavy builds: manual dispatch only; path-based auto-trigger will be
# enabled when build times are acceptable.
name: FFmpeg mobile artifacts

on:
  workflow_dispatch:

# Sequential, never cancel an in-flight heavy build; queued runs wait for the
# previous one to finish instead of discarding its progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ffmpeg-android:
    name: FFmpeg for Android (all ABIs)
    # Pinned: ubuntu-latest became Ubuntu 26.04 in November 2026,
    # where the Android emulator (37.3.10) dies instantly at boot; the
    # 24.04 image is the validated environment (and keeps builds
    # reproducible against a moving label).
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # sdkmanager is a Java tool; the build script needs it when the pinned
      # NDK is not present yet and must be installed.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The build script auto-resolves the pinned NDK: it finds
      # $ANDROID_HOME/ndk/<pinned> or installs it through sdkmanager, which
      # lives in the preinstalled cmdline-tools (not on PATH by default).
      - name: Expose sdkmanager (NDK auto-install fallback)
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install host build tools
        run: |
          sudo apt-get update
          # meson: dav1d/fribidi cross builds; nasm: dav1d x86_64 asm;
          # pkg-config: FFmpeg configure probes the cross prefix.
          sudo apt-get install -y ninja-build meson nasm pkg-config

      - name: Restore FFmpeg source cache
        id: ffmpeg-sources
        uses: actions/cache/restore@v4
        with:
          # Upstream source tarballs; the key changes whenever the pinned
          # versions in versions.json change.
          path: tools/ffmpeg-builder/downloads
          key: ffmpeg-downloads-${{ runner.os }}-${{ hashFiles('tools/ffmpeg-builder/versions.json') }}
          restore-keys: |
            ffmpeg-downloads-${{ runner.os }}-

      # The repository script owns everything: NDK resolution and the
      # arm64-v8a / armeabi-v7a / x86_64 cross-builds.
      - name: Build FFmpeg for all Android ABIs
        id: build-ffmpeg
        env:
          # ubuntu-latest runners provide 4 vCPUs.
          VELMUX_FFMPEG_JOBS: 4
        run: ./scripts/build.sh --ffmpeg-android --all-abis

      - name: Save FFmpeg source cache
        # Save only after a successful build and only when this run actually
        # downloaded something (no exact cache hit). A lost cross-run cache
        # race only costs a later re-download, hence continue-on-error.
        if: steps.build-ffmpeg.outcome == 'success' && steps.ffmpeg-sources.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: tools/ffmpeg-builder/downloads
          key: ffmpeg-downloads-${{ runner.os }}-${{ hashFiles('tools/ffmpeg-builder/versions.json') }}

      - name: Upload Android FFmpeg artifacts
        uses: actions/upload-artifact@v4
        with:
          name: velmux-ffmpeg-android
          path: tools/ffmpeg-builder/out/android/**
          retention-days: 14

  ffmpeg-ios:
    name: FFmpeg for iOS (device and simulator)
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install build tools
        run: |
          # meson: dav1d/fribidi cross builds. cmake/ninja/pkg-config are
          # preinstalled on macOS runners. nasm is only needed for the
          # opt-in Intel simulator slice (VELMUX_IOS_SIM_X86_64=1);
          # the default arm64 slices need no assembler.
          if ! command -v meson >/dev/null 2>&1; then
            brew install meson
          fi
          if ! command -v nasm >/dev/null 2>&1; then
            brew install nasm
          fi

      - name: Restore FFmpeg source cache
        id: ffmpeg-sources
        uses: actions/cache/restore@v4
        with:
          # Upstream source tarballs; the key changes whenever the pinned
          # versions in versions.json change.
          path: tools/ffmpeg-builder/downloads
          key: ffmpeg-downloads-${{ runner.os }}-${{ hashFiles('tools/ffmpeg-builder/versions.json') }}
          restore-keys: |
            ffmpeg-downloads-${{ runner.os }}-

      # The repository script owns everything: the iphoneos and
      # iphonesimulator slices, laid out so they can be wrapped into an
      # xcframework.
      - name: Build FFmpeg for iOS
        id: build-ffmpeg
        run: ./scripts/build.sh --ffmpeg-ios

      - name: Save FFmpeg source cache
        # Save only after a successful build and only when this run actually
        # downloaded something (no exact cache hit). A lost cross-run cache
        # race only costs a later re-download, hence continue-on-error.
        if: steps.build-ffmpeg.outcome == 'success' && steps.ffmpeg-sources.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: tools/ffmpeg-builder/downloads
          key: ffmpeg-downloads-${{ runner.os }}-${{ hashFiles('tools/ffmpeg-builder/versions.json') }}

      - name: Upload iOS FFmpeg artifacts
        uses: actions/upload-artifact@v4
        with:
          name: velmux-ffmpeg-ios
          path: tools/ffmpeg-builder/out/ios/**
          retention-days: 14
