# Velmux release pipeline.
#
# Tag-driven (push a v* tag) or manual dispatch. Produces the real release
# artifacts and — only after every gate succeeds — a GitHub Release with:
#   - Android release APK + AAB (R8-minified; CI-signed via secrets when
#     configured, otherwise test-signed with the debug keystore and marked
#     as such)
#   - iOS Release-configuration simulator .app and an unsigned device .app
#     (archive-capable; store signing requires credentials this repo does
#     not commit)
#   - R8 mapping + native symbols for crash symbolication
#   - SHA-256 checksums and a machine-readable build manifest
#
# Gates (a Release is never published from a failing or incomplete build):
#   1. host-tests: the full host suite (pinned FFmpeg + all C++
#      engine/backend/bridge tests through ctest) runs INSIDE this workflow.
#   2. android-release and ios-release build through the repository
#      scripts. FFmpeg is mandatory: the scripts resolve it (identity-
#      checked reuse or rebuild) themselves; CI only provides identity-
#      keyed caches, so a release build without the real FFmpeg backend
#      cannot exist.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.0-rc.1)'
        required: true
        default: 'v0.1.0-rc.1'
      create_github_release:
        description: 'Publish a GitHub Release when all gates pass'
        type: boolean
        required: true
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  host-tests:
    name: Gate - host engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev meson pkg-config

      - name: Verify CMake toolchain
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            python3 -m pip install cmake ninja
          fi
          cmake --version

      - name: Compute FFmpeg artifact identity
        id: ffid
        run: echo "identity=$(bash scripts/ffmpeg/identity.sh host)" >> "$GITHUB_OUTPUT"

      - name: Restore host FFmpeg cache
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          # Both the built host artifacts and the downloaded source tarballs.
          # The key is the exact identity the scripts verify before reuse.
          path: |
            tools/ffmpeg-builder/out/host
            tools/ffmpeg-builder/downloads
          key: ffmpeg-host-${{ steps.ffid.outputs.identity }}

      # The repository script owns everything: FFmpeg resolve/rebuild,
      # CMake configure, build, ctest.
      - name: Host suite (FFmpeg resolve + build + ctest)
        id: host-suite
        env:
          VELMUX_FFMPEG_JOBS: 4
        run: ./scripts/test.sh

      - name: Save host FFmpeg cache
        if: steps.host-suite.outcome == 'success' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            tools/ffmpeg-builder/out/host
            tools/ffmpeg-builder/downloads
          key: ffmpeg-host-${{ steps.ffid.outputs.identity }}

  android-release:
    name: Android release artifacts
    needs: host-tests
    runs-on: ubuntu-latest
    # FFmpeg arm64 cold build + R8 release build (same budget as the
    # per-push Android release build in android.yml).
    timeout-minutes: 75
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
      version-name: ${{ steps.version.outputs.version-name }}
      version-code: ${{ steps.version.outputs.version-code }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Derive version metadata
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.version }}"
          fi
          VERSION_NAME="${TAG#v}"
          echo "version-name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version-code=1" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The build script auto-resolves the pinned NDK: it finds
      # $ANDROID_HOME/ndk/<pinned> or installs it through sdkmanager, which
      # lives in the preinstalled cmdline-tools (not on PATH by default).
      - name: Expose sdkmanager (NDK auto-install fallback)
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Compute FFmpeg artifact identity
        id: ffid
        run: |
          # The Android FFmpeg identity includes the resolved NDK revision;
          # resolve the NDK exactly the way the build scripts do so the
          # cache key can never disagree with the identity fetch.sh
          # verifies during the build.
          source scripts/lib/common.sh
          resolve_android_ndk
          echo "identity=$(bash scripts/ffmpeg/identity.sh android arm64-v8a)" >> "$GITHUB_OUTPUT"

      - name: Restore FFmpeg artifacts
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          # Both the built arm64-v8a artifacts and the downloaded source
          # tarballs. The key is the exact identity the scripts verify
          # before reuse.
          path: |
            tools/ffmpeg-builder/out/android
            tools/ffmpeg-builder/downloads
          key: ffmpeg-android-arm64-v8a-${{ steps.ffid.outputs.identity }}

      - name: Prepare release signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "${RUNNER_TEMP}/velmux-release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No release signing secrets configured; the release build will be test-signed with the debug keystore. Store distribution requires a private release keystore (see docs/RELEASE.md)."
          fi

      # The repository script owns everything: FFmpeg resolve/rebuild
      # (mandatory — no "without FFmpeg" path exists), JS dependency
      # install, gradle assembleRelease + bundleRelease. FFmpeg is resolved
      # or built by the script itself.
      - name: Build release APK and AAB
        id: build
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          KEYSTORE: ${{ runner.temp }}/velmux-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VELMUX_VERSION_NAME: ${{ steps.version.outputs.version-name }}
          VELMUX_VERSION_CODE: ${{ steps.version.outputs.version-code }}
          VELMUX_FFMPEG_JOBS: 4
        run: |
          if [ "$SIGNED" = "true" ]; then
            ./scripts/android/build.sh --release --abi arm64-v8a --jobs 4 \
              --signing "$KEYSTORE" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"
          else
            # Test-signed with the debug keystore (see the warning above).
            ./scripts/build.sh --android --release
          fi

      - name: Save FFmpeg artifacts
        if: steps.build.outcome == 'success' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            tools/ffmpeg-builder/out/android
            tools/ffmpeg-builder/downloads
          key: ffmpeg-android-arm64-v8a-${{ steps.ffid.outputs.identity }}

      # The repository script collects APK, AAB, the R8 mapping, unstripped
      # native symbols and SHA-256 checksums into the staging directory.
      - name: Package release artifacts
        run: ./scripts/android/package.sh "${RUNNER_TEMP}/velmux-release"

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: velmux-android-release
          path: ${{ runner.temp }}/velmux-release
          if-no-files-found: error
          retention-days: 14

  ios-release:
    name: iOS release build
    needs: host-tests
    runs-on: macos-15
    # Two FFmpeg slices (device + simulator) may build cold, plus two app
    # builds (same budget as the per-push iOS workflow).
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Derive version metadata
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.version }}"
          fi
          VERSION_NAME="${TAG#v}"
          # Kept for reference: the build scripts receive the full
          # VELMUX_VERSION_NAME (rc suffix included) and derive the numeric
          # CFBundleShortVersionString (MARKETING_VERSION) themselves.
          MARKETING="${VERSION_NAME%%-*}"
          echo "version-name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "marketing=${MARKETING}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      # The iOS FFmpeg cross-build (run by the scripts when the artifacts
      # are missing or stale) needs these. cmake/ninja/pkg-config are
      # preinstalled on macOS runners.
      - name: Install FFmpeg build tools
        run: |
          if ! command -v meson >/dev/null 2>&1; then
            brew install meson
          fi
          if ! command -v nasm >/dev/null 2>&1; then
            brew install nasm
          fi

      - name: Compute FFmpeg artifact identity
        id: ffid
        run: echo "identity=$(bash scripts/ffmpeg/identity.sh ios device)" >> "$GITHUB_OUTPUT"

      - name: Restore FFmpeg artifacts
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          # Both the built iOS artifacts (device + simulator slices) and the
          # downloaded source tarballs. The key is the exact identity the
          # scripts verify before reuse.
          path: |
            tools/ffmpeg-builder/out/ios
            tools/ffmpeg-builder/downloads
          key: ffmpeg-ios-device-${{ steps.ffid.outputs.identity }}

      # The repository script owns everything: FFmpeg resolve/rebuild
      # (mandatory), xcframework packaging, pod install, the Xcode build
      # invocation. Release configuration, signing-independent
      # (CODE_SIGNING_ALLOWED=NO). Two artifacts:
      #   1. simulator .app — directly runnable for validation;
      #   2. unsigned device .app — archive-capable: re-signable/re-
      #      archivable with real certificates. Not an IPA and never
      #      presented as one.
      - name: Build Release for the iOS simulator
        env:
          VELMUX_VERSION_NAME: ${{ steps.version.outputs.version-name }}
          VELMUX_VERSION_CODE: ${{ github.run_number }}
        run: ./scripts/ios/build.sh --release --sdk simulator

      - name: Build Release for iOS devices (unsigned, archive-capable)
        id: build
        env:
          VELMUX_VERSION_NAME: ${{ steps.version.outputs.version-name }}
          VELMUX_VERSION_CODE: ${{ github.run_number }}
        run: ./scripts/ios/build.sh --release --sdk device

      - name: Save FFmpeg artifacts
        if: steps.build.outcome == 'success' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            tools/ffmpeg-builder/out/ios
            tools/ffmpeg-builder/downloads
          key: ffmpeg-ios-device-${{ steps.ffid.outputs.identity }}

      # The repository script zips BOTH Release .app bundles and writes the
      # SHA-256 checksums into the staging directory.
      - name: Package release artifacts
        run: ./scripts/ios/package.sh "${RUNNER_TEMP}/velmux-release"

      - name: Upload iOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: velmux-ios-release
          path: ${{ runner.temp }}/velmux-release
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: Publish GitHub Release
    needs: [host-tests, android-release, ios-release]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.create_github_release)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Required to create the tag (when dispatching) and the Release.
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Derive release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/velmux-release-staging
          pattern: velmux-*-release
          merge-multiple: true

      - name: Generate checksums and manifest
        working-directory: /tmp/velmux-release-staging
        env:
          SIGNED: ${{ needs.android-release.outputs.signed }}
        run: |
          sha256sum ./* > SHA256SUMS.txt 2>/dev/null || \
            find . -maxdepth 1 -type f -exec sha256sum {} + > SHA256SUMS.txt
          python3 - <<'PYEOF' > manifest.json
          import hashlib, json, os, subprocess, sys, datetime
          tag = "${{ steps.tag.outputs.tag }}"
          files = {}
          for name in sorted(os.listdir('.')):
              if os.path.isfile(name):
                  h = hashlib.sha256(open(name, 'rb').read()).hexdigest()
                  files[name] = {"sha256": h, "bytes": os.path.getsize(name)}
          manifest = {
              "version": tag,
              "commit": os.environ.get("GITHUB_SHA", ""),
              "builtAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "android": {
                  "versionName": "${{ needs.android-release.outputs.version-name }}",
                  "versionCode": int("${{ needs.android-release.outputs.version-code }}"),
                  "signing": "release-keystore" if "${{ needs.android-release.outputs.signed }}" == "true" else "debug-keystore (test-signed; store distribution requires a private release keystore)",
              },
              "ios": {
                  "artifact": "unsigned device .app (archive-capable); store distribution requires an Apple Developer certificate and re-signing",
              },
              "ffmpeg": {
                  "source": "pinned sources in tools/ffmpeg-builder/versions.json",
                  "versionsLock": subprocess.run(
                      ["sha256sum", "tools/ffmpeg-builder/versions.json"],
                      capture_output=True, text=True,
                      cwd=os.environ.get("GITHUB_WORKSPACE", ".")).stdout.split()[0],
              },
              "artifacts": files,
          }
          json.dump(manifest, sys.stdout, indent=2)
          PYEOF
          cat manifest.json

      - name: Select release notes
        id: notes
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION_NAME="${TAG#v}"
          if [ -f "docs/release-notes/${VERSION_NAME}.md" ]; then
            echo "path=docs/release-notes/${VERSION_NAME}.md" >> "$GITHUB_OUTPUT"
          else
            cat > /tmp/velmux-release-notes.md <<EOF
          # Velmux ${TAG}

          Release candidate built from commit ${GITHUB_SHA}.

          See docs/PROJECT_STATUS.md for the current implementation and
          validation state, and docs/AUDIT.md for the feature audit.
          EOF
            echo "path=/tmp/velmux-release-notes.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        working-directory: /tmp/velmux-release-staging
        run: |
          # RC versions publish as GitHub pre-releases; stable tags do not.
          PRERELEASE_FLAG="--prerelease"
          case "$TAG" in
            *-rc*|*-alpha*|*-beta*|*-pre*) ;;
            *) PRERELEASE_FLAG="" ;;
          esac
          # --target creates the tag at this SHA when dispatching manually.
          gh release create "$TAG" ./* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Velmux $TAG" \
            --notes-file "${{ steps.notes.outputs.path }}" \
            $PRERELEASE_FLAG
