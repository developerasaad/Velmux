# CI for the iOS application: CocoaPods install plus a simulator build with
# code signing disabled (no certificates needed on CI).
name: iOS build

on:
  push:
    paths:
      - apps/**
      - core/**
      - backends/**
      - bridge/**
      - .github/workflows/ios.yml
  pull_request:
    paths:
      - apps/**
      - core/**
      - backends/**
      - bridge/**
      - .github/workflows/ios.yml
  workflow_dispatch:

# One run per ref; a newer push supersedes the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # actions: read is required to download artifacts produced by the
  # ffmpeg-mobile workflow's runs (Milestone 3 wiring).
  actions: read

jobs:
  build:
    name: iOS simulator build
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install JS dependencies
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund

      # Milestone 3 wiring: consume the pinned FFmpeg iOS artifacts from the
      # latest successful ffmpeg-mobile run on main so the built app carries
      # the real FFmpeg backend. Push events only: fork pull requests cannot
      # read this repository's cross-run artifacts.
      - name: Locate FFmpeg iOS artifacts
        id: ffmpeg-artifact
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ffmpeg-mobile.yml',
                status: 'success',
                per_page: 10,
              },
            );
            const run = runs.find(
              (r) => r.head_branch === 'main' && r.path === '.github/workflows/ffmpeg-mobile.yml',
            );
            if (!run) {
              core.warning(
                'No successful ffmpeg-mobile run on main; building without the FFmpeg backend',
              );
              return;
            }
            core.info(`Using FFmpeg artifacts from run ${run.id}`);
            core.setOutput('run-id', String(run.id));

      - name: Download FFmpeg iOS artifacts
        if: steps.ffmpeg-artifact.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: velmux-ffmpeg-ios
          run-id: ${{ steps.ffmpeg-artifact.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: tools/ffmpeg-builder/out/ios

      - name: Package FFmpeg xcframework
        if: steps.ffmpeg-artifact.outputs.run-id != ''
        run: |
          if [ -d "${GITHUB_WORKSPACE}/tools/ffmpeg-builder/out/ios/iphoneos" ]; then
            tools/ffmpeg-builder/package-ios-xcframework.sh \
              "${GITHUB_WORKSPACE}/tools/ffmpeg-builder/out/ios" \
              "${GITHUB_WORKSPACE}/ffmpeg-ios-packaged"
            echo "VELMUX_FFMPEG_ROOT=${GITHUB_WORKSPACE}/ffmpeg-ios-packaged" >> "$GITHUB_ENV"
          else
            echo "::warning::FFmpeg iOS artifacts incomplete; building without the FFmpeg backend"
          fi

      - name: Install CocoaPods dependencies
        working-directory: apps/mobile/ios
        run: |
          if [ ! -f Podfile ]; then
            echo "No Podfile found; skipping pod install."
            exit 0
          fi
          # CocoaPods is preinstalled on macOS runners; install it on demand
          # if the image ever drops it.
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods
          fi
          if [ -n "${VELMUX_FFMPEG_ROOT:-}" ]; then
            echo "pod install with FFmpeg backend (${VELMUX_FFMPEG_ROOT})"
          fi
          pod install

      # Raw xcodebuild output only: piping through xcpretty hid compile
      # diagnostics in earlier failures. CODE_SIGNING_ALLOWED=NO keeps the
      # simulator build certificate-free.
      - name: Build for the iOS simulator
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -workspace Velmux.xcworkspace -scheme Velmux -configuration Debug -sdk iphonesimulator build CODE_SIGNING_ALLOWED=NO
