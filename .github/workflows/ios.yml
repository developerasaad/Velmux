# CI for the iOS application: the repository's test script (simulator run:
# FFmpeg resolve/rebuild through the Xcode project's "Prepare engine and
# framework" phase, the Release simulator app build, cold-launch + engine
# init marker verification, the VelmuxEngineTests XCTest suite, relaunch)
# followed by the unsigned device Release product build through the
# repository's build script. CI only provides the toolchain, JDK/Gradle,
# an identity-keyed FFmpeg cache, and the artifact upload.
name: iOS build

on:
  push:
    paths:
      - ui/**
      - core/**
      - platform/ios/**
      - scripts/**
      - third_party/**
      - CMakeLists.txt
      - settings.gradle.kts
      - build.gradle.kts
      - gradle.properties
      - gradle/**
      - gradlew
      - gradlew.bat
      - .github/workflows/ios.yml
  pull_request:
    paths:
      - ui/**
      - core/**
      - platform/ios/**
      - scripts/**
      - third_party/**
      - CMakeLists.txt
      - settings.gradle.kts
      - build.gradle.kts
      - gradle.properties
      - gradle/**
      - gradlew
      - gradlew.bat
      - .github/workflows/ios.yml
  workflow_dispatch:

# One run per ref; a newer push supersedes the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    name: iOS simulator suite and device build
    runs-on: macos-15
    # The simulator suite (FFmpeg + Release app build + engine XCTest suite
    # with on-simulator fixtures) plus the device Release build need more
    # than the old 90-minute budget on busy runners when FFmpeg is cold.
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # The iOS FFmpeg cross-build (run by the scripts when the artifacts
      # are missing or stale) needs these. cmake/ninja/pkg-config are
      # preinstalled on macOS runners; autoconf/automake provide zimg's
      # autoreconf (the builder builds a pinned libtool itself when the
      # host ships no libtoolize).
      - name: Install FFmpeg build tools
        run: |
          # meson: dav1d/fribidi cross builds. nasm is only needed for the
          # opt-in Intel simulator slice (VELMUX_IOS_SIM_X86_64=1) but is
          # cheap to keep available.
          if ! command -v meson >/dev/null 2>&1; then
            brew install meson
          fi
          if ! command -v nasm >/dev/null 2>&1; then
            brew install nasm
          fi
          if ! command -v autoreconf >/dev/null 2>&1; then
            brew install autoconf automake
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle dependency and wrapper caching (the Kotlin Compose framework
      # link task runs through the Gradle wrapper).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute FFmpeg artifact identity
        id: ffid
        run: echo "identity=$(bash scripts/ffmpeg/identity.sh ios device)" >> "$GITHUB_OUTPUT"

      - name: Restore FFmpeg artifacts
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          # Both the built iOS artifacts (device + simulator slices) and the
          # downloaded source tarballs. The key is the exact identity the
          # scripts verify before reuse.
          path: |
            scripts/ffmpeg-builder/out/ios
            scripts/ffmpeg-builder/downloads
          key: ffmpeg-ios-device-${{ steps.ffid.outputs.identity }}

      # The repository script owns everything: FFmpeg resolve/rebuild (the
      # Xcode "Prepare engine and framework" phase), the CMake engine
      # archives, the Kotlin Compose framework, the Release simulator app
      # build, simulator boot, cold-launch + engine-init marker
      # verification, the VelmuxEngineTests XCTest suite, and the relaunch
      # check.
      - name: iOS simulator suite (FFmpeg resolve + app build + XCTest)
        id: ios-sim
        env:
          VELMUX_FFMPEG_JOBS: 3
        run: ./scripts/test.sh --ios-sim

      # The product-build gate: the unsigned device Release build
      # (CODE_SIGNING_ALLOWED=NO is passed by the script). Products land in
      # platform/ios/host/build-device/Build/Products/Release-iphoneos/.
      - name: Build Release for iOS devices (unsigned)
        id: device-build
        env:
          VELMUX_FFMPEG_JOBS: 3
        run: ./scripts/build.sh --ios --release

      # Diagnostics on failure: the BUILD-IDENTITY files (recorded hash +
      # provenance of every FFmpeg layout/slice) and the simulator test
      # diagnostics. Without these, an identity-gate failure leaves nothing
      # to diagnose from.
      - name: Collect FFmpeg identity diagnostics on failure
        if: failure()
        run: |
          mkdir -p /tmp/ffdiag
          for f in \
              scripts/ffmpeg-builder/out/ios/iphoneos/BUILD-IDENTITY \
              scripts/ffmpeg-builder/out/ios/iphonesimulator/BUILD-IDENTITY \
              scripts/ffmpeg-builder/out/ios/slices/*/BUILD-IDENTITY \
              scripts/ffmpeg-builder/out/ios/manifest.json; do
            if [ -f "$f" ]; then
              cp "$f" "/tmp/ffdiag/$(printf '%s' "$f" | tr '/' '_')"
            fi
          done
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: velmux-ios-diag
          path: |
            /tmp/ffdiag
            platform/ios/host/sim-test-diagnostics
          if-no-files-found: ignore
          retention-days: 7

      - name: Save FFmpeg artifacts
        # Save only after the builds succeeded and only when this run
        # actually built something (no exact cache hit), so a partial
        # output can never poison the cache. A lost cross-run cache race
        # only costs a later rebuild, hence continue-on-error.
        if: steps.device-build.outcome == 'success' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            scripts/ffmpeg-builder/out/ios
            scripts/ffmpeg-builder/downloads
          key: ffmpeg-ios-device-${{ steps.ffid.outputs.identity }}

      - name: Upload device app
        uses: actions/upload-artifact@v4
        with:
          name: velmux-ios-device-app
          path: platform/ios/host/build-device/Build/Products/Release-iphoneos/Velmux.app
          if-no-files-found: error
