# CI for the iOS application: the repository's test script (simulator run:
# FFmpeg resolve/rebuild, Release simulator app build with the embedded JS
# bundle, cold-launch + RN init marker verification, the VelmuxEngineTests
# XCTest suite, relaunch) followed by the unsigned device Release product
# build through the repository's build script. CI only provides the
# toolchain, an identity-keyed FFmpeg cache, and the artifact upload.
name: iOS build

on:
  push:
    paths:
      - apps/**
      - core/**
      - backends/**
      - bridge/**
      - tools/ffmpeg-builder/**
      - .github/workflows/ios.yml
  pull_request:
    paths:
      - apps/**
      - core/**
      - backends/**
      - bridge/**
      - tools/ffmpeg-builder/**
      - .github/workflows/ios.yml
  workflow_dispatch:

# One run per ref; a newer push supersedes the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    name: iOS simulator suite and device build
    runs-on: macos-15
    # The simulator suite (FFmpeg + Release app build + engine XCTest suite
    # with on-simulator fixtures) plus the device Release build need more
    # than the old 90-minute budget on busy runners when FFmpeg is cold.
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      # The iOS FFmpeg cross-build (run by the scripts when the artifacts
      # are missing or stale) needs these. cmake/ninja/pkg-config are
      # preinstalled on macOS runners.
      - name: Install FFmpeg build tools
        run: |
          # meson: dav1d/fribidi cross builds; nasm assembles libvpx's
          # x86_64 code for the Intel simulator slice.
          if ! command -v meson >/dev/null 2>&1; then
            brew install meson
          fi
          if ! command -v nasm >/dev/null 2>&1; then
            brew install nasm
          fi

      - name: Compute FFmpeg artifact identity
        id: ffid
        run: echo "identity=$(bash scripts/ffmpeg/identity.sh ios device)" >> "$GITHUB_OUTPUT"

      - name: Restore FFmpeg artifacts
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          # Both the built iOS artifacts (device + simulator slices) and the
          # downloaded source tarballs. The key is the exact identity the
          # scripts verify before reuse.
          path: |
            tools/ffmpeg-builder/out/ios
            tools/ffmpeg-builder/downloads
          key: ffmpeg-ios-device-${{ steps.ffid.outputs.identity }}

      # The repository script owns everything: FFmpeg resolve/rebuild,
      # xcframework packaging, pod install, the Release simulator app
      # build, simulator boot, cold-launch + RN init marker verification,
      # the VelmuxEngineTests XCTest suite, and the relaunch check.
      - name: iOS simulator suite (FFmpeg resolve + app build + XCTest)
        id: ios-sim
        run: ./scripts/test.sh --ios-sim

      # The product-build gate: the unsigned device Release build
      # (CODE_SIGNING_ALLOWED=NO is passed by the script). Products land in
      # apps/mobile/ios/build-device/Build/Products/Release-iphoneos/.
      - name: Build Release for iOS devices (unsigned)
        id: device-build
        run: ./scripts/build.sh --ios --release

      - name: Save FFmpeg artifacts
        # Save only after the builds succeeded and only when this run
        # actually built something (no exact cache hit), so a partial
        # output can never poison the cache. A lost cross-run cache race
        # only costs a later rebuild, hence continue-on-error.
        if: steps.device-build.outcome == 'success' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            tools/ffmpeg-builder/out/ios
            tools/ffmpeg-builder/downloads
          key: ffmpeg-ios-device-${{ steps.ffid.outputs.identity }}

      - name: Upload device app
        uses: actions/upload-artifact@v4
        with:
          name: velmux-ios-device-app
          path: apps/mobile/ios/build-device/Build/Products/Release-iphoneos/Velmux.app
          if-no-files-found: error
