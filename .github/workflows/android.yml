# CI for the Android application: JS dependency install plus debug APK
# assembly through the Gradle wrapper.
name: Android build

on:
  push:
    paths:
      - apps/**
      - core/**
      - backends/**
      - bridge/**
      - .github/workflows/android.yml
  pull_request:
    paths:
      - apps/**
      - core/**
      - backends/**
      - bridge/**
      - .github/workflows/android.yml
  workflow_dispatch:

# One run per ref; a newer push supersedes the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install JS dependencies
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle dependency and wrapper caching is enabled by default here.
      # Note: the first run starts with an empty Gradle cache, so expect a
      # cold and slow build; subsequent runs restore Gradle state from cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Always attempt the upload so a compiled APK is kept even when a later
      # step fails, but never fail merely because no APK was produced.
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velmux-android-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
