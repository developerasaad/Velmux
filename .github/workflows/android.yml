# CI for the Android application: JS dependency install plus debug APK
# assembly through the Gradle wrapper.
name: Android build

on:
  push:
    paths:
      - apps/**
      - core/**
      - backends/**
      - bridge/**
      - .github/workflows/android.yml
  pull_request:
    paths:
      - apps/**
      - core/**
      - backends/**
      - bridge/**
      - .github/workflows/android.yml
  workflow_dispatch:

# One run per ref; a newer push supersedes the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # actions: read is required to download artifacts produced by the
  # ffmpeg-mobile workflow's runs (Milestone 3 wiring).
  actions: read

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install JS dependencies
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle dependency and wrapper caching is enabled by default here.
      # Note: the first run starts with an empty Gradle cache, so expect a
      # cold and slow build; subsequent runs restore Gradle state from cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Milestone 3 wiring: consume the pinned FFmpeg Android artifacts from
      # the latest successful ffmpeg-mobile run on main so the shipped APK
      # carries the real FFmpeg backend. Push events only: fork pull requests
      # cannot read this repository's cross-run artifacts.
      - name: Locate FFmpeg Android artifacts
        id: ffmpeg-artifact
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ffmpeg-mobile.yml',
                status: 'success',
                per_page: 10,
              },
            );
            const run = runs.find(
              (r) => r.head_branch === 'main' && r.path === '.github/workflows/ffmpeg-mobile.yml',
            );
            if (!run) {
              core.warning(
                'No successful ffmpeg-mobile run on main; building without the FFmpeg backend',
              );
              return;
            }
            core.info(`Using FFmpeg artifacts from run ${run.id}`);
            core.setOutput('run-id', String(run.id));

      - name: Download FFmpeg Android artifacts
        if: steps.ffmpeg-artifact.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: velmux-ffmpeg-android
          run-id: ${{ steps.ffmpeg-artifact.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # The artifact's pkg-config files bake absolute paths from the
          # ffmpeg-mobile runner workspace; restoring the same tree keeps
          # them valid (both workflows check out at
          # /home/runner/work/Velmux/Velmux).
          path: tools/ffmpeg-builder/out/android

      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: |
          if [ -d "${GITHUB_WORKSPACE}/tools/ffmpeg-builder/out/android/arm64-v8a" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace \
              -PvelmuxFFmpegPrefix="${GITHUB_WORKSPACE}/tools/ffmpeg-builder/out/android"
          else
            echo "::warning::No FFmpeg Android artifacts available; the APK builds with the Android backend only (the engine reports this honestly at runtime)."
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      # Always attempt the upload so a compiled APK is kept even when a later
      # step fails, but never fail merely because no APK was produced.
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velmux-android-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
