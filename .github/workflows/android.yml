# CI for the Android application: a release build through the repository's
# build script. FFmpeg is mandatory — ./scripts/build.sh resolves it
# (identity-checked reuse or rebuild) itself; CI only provides the toolchain
# (JDK/Gradle), an identity-keyed FFmpeg cache, and the artifact upload.
name: Android build

on:
  push:
    paths:
      - core/**
      - platform/**
      - ui/**
      - scripts/**
      - testdata/**
      - CMakeLists.txt
      - settings.gradle.kts
      - build.gradle.kts
      - gradle.properties
      - gradle/**
      - gradlew
      - gradlew.bat
      - .github/workflows/android.yml
  pull_request:
    paths:
      - core/**
      - platform/**
      - ui/**
      - scripts/**
      - testdata/**
      - CMakeLists.txt
      - settings.gradle.kts
      - build.gradle.kts
      - gradle.properties
      - gradle/**
      - gradlew
      - gradlew.bat
      - .github/workflows/android.yml
  workflow_dispatch:

# One run per ref; a newer push supersedes the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android release build
    # Pinned: ubuntu-latest became Ubuntu 26.04 in November 2026,
    # where the Android emulator (37.3.10) dies instantly at boot; the
    # 24.04 image is the validated environment (and keeps builds
    # reproducible against a moving label).
    runs-on: ubuntu-24.04
    # FFmpeg arm64 cold build + R8 release build.
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install FFmpeg build tools
        # The mandatory-FFmpeg policy makes every app build resolve (and,
        # on a cache miss, BUILD) the pinned FFmpeg inline: dav1d needs
        # meson, x265/zimg need cmake + ninja (cmake is preinstalled on
        # GitHub-hosted runners), zimg's autogen needs libtool.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build meson pkg-config libtool

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle dependency and wrapper caching is enabled by default here.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The build script auto-resolves the pinned NDK: it finds
      # $ANDROID_HOME/ndk/<pinned> or installs it through sdkmanager, which
      # lives in the preinstalled cmdline-tools (not on PATH by default).
      - name: Expose sdkmanager (NDK auto-install fallback)
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Compute FFmpeg artifact identity
        id: ffid
        run: |
          # The Android FFmpeg identity includes the resolved NDK revision;
          # resolve the NDK exactly the way the build scripts do so the
          # cache key can never disagree with the identity fetch.sh
          # verifies during the build.
          source scripts/lib/common.sh
          resolve_android_ndk
          echo "identity=$(bash scripts/ffmpeg/identity.sh android arm64-v8a)" >> "$GITHUB_OUTPUT"

      - name: Restore FFmpeg artifacts
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          # Both the built arm64-v8a artifacts and the downloaded source
          # tarballs. The key is the exact identity the scripts verify
          # before reuse.
          path: |
            scripts/ffmpeg-builder/out/android
            scripts/ffmpeg-builder/downloads
          key: ffmpeg-android-arm64-v8a-${{ steps.ffid.outputs.identity }}

      # The repository script owns everything: FFmpeg resolve/rebuild, the
      # Compose/KMP Gradle assembly (assembleRelease + bundleRelease).
      - name: Build release APK and AAB
        id: build
        env:
          # ubuntu-latest runners provide 4 vCPUs.
          VELMUX_FFMPEG_JOBS: 4
        run: ./scripts/build.sh --android --release

      - name: Save FFmpeg artifacts
        # Save only after a successful build and only when this run actually
        # built something (no exact cache hit), so a partial output can
        # never poison the cache. A lost cross-run cache race only costs a
        # later rebuild, hence continue-on-error.
        if: steps.build.outcome == 'success' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            scripts/ffmpeg-builder/out/android
            scripts/ffmpeg-builder/downloads
          key: ffmpeg-android-arm64-v8a-${{ steps.ffid.outputs.identity }}

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: velmux-android-release-apk
          path: platform/android/host/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: velmux-android-release-aab
          path: platform/android/host/build/outputs/bundle/release/*.aab
          if-no-files-found: error
