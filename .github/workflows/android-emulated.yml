# Real-emulator validation of the Android instrumented tests: the engine's
# C++ core runs behind the same JNI facade the React Native app uses, with
# the Android MediaCodec backend only (no FFmpeg prefix), converting real
# media on API 29 (the product floor, docs/DECISIONS.md D-003) and API 34
# AOSP emulators.
#
# The emulator is provisioned manually (cmdline-tools + sdkmanager +
# avdmanager + emulator CLI) so the whole pipeline stays first-party and
# cacheable; no third-party emulator actions.
name: Android emulated

on:
  push:
    paths:
      - apps/**
      - core/**
      - backends/**
      - bridge/**
      - .github/workflows/android-emulated.yml
  workflow_dispatch:

# One run per ref; a newer push supersedes the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  instrumented:
    name: Instrumented tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # minSdk 29 is the product floor; 34 is the modern baseline.
          # `default` = AOSP images; the tests need no Google APIs.
          - api-level: 29
            system-image: system-images;android-29;default;x86_64
          - api-level: 34
            system-image: system-images;android-34;default;x86_64
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install JS dependencies
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle dependency and wrapper caching is enabled by default here.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install emulator host packages
        run: |
          sudo apt-get update -qq
          # libX11/libxcb: the emulator (QEMU frontend) links against them
          # even with -no-window. libpulse0/libnss3 are pulled in by the
          # emulator's audio/metrics components; on ubuntu-24.04 (noble)
          # ALSA is packaged as libasound2t64 (libasound2 on older images)
          # - install whichever name resolves.
          sudo apt-get install -y libx11-6 libxcb1 libpulse0 libnss3
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2
          # KVM hardware acceleration is what makes a headless emulator
          # viable on the runner; fail loudly if it is unavailable.
          test -e /dev/kvm || {
            echo "::error::/dev/kvm is missing on this runner"
            exit 1
          }

      # The SDK lives in $HOME/android-sdk (never the runner's preinstalled
      # tree) so every byte below is owned by this workflow and cacheable.
      # Shared pieces (cmdline-tools, emulator, platform/build pieces, NDK)
      # are keyed on the pinned tool versions; the system image is keyed on
      # the API level because that is the only per-matrix difference.
      - name: Cache shared Android SDK pieces
        uses: actions/cache@v4
        with:
          path: |
            ~/android-sdk/cmdline-tools
            ~/android-sdk/platform-tools
            ~/android-sdk/emulator
            ~/android-sdk/platforms
            ~/android-sdk/build-tools
            ~/android-sdk/ndk
            ~/android-sdk/cmake
            ~/android-sdk/licenses
          # Mirrors the pins in apps/mobile/android (build.gradle ext +
          # app/build.gradle): platform 37.0, build-tools 37.0.0,
          # NDK 27.1.12297006, CMake 3.22.1. Bump when those pins change.
          key: velmux-android-sdk-37.0_37.0.0_27.1.12297006_3.22.1

      - name: Cache emulator system image (API ${{ matrix.api-level }})
        uses: actions/cache@v4
        with:
          path: ~/android-sdk/system-images
          key: velmux-android-sysimg-${{ matrix.api-level }}

      - name: Install Android cmdline-tools
        run: |
          SDK="$HOME/android-sdk"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -sS -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          # Every later step (Gradle/AGP included) must see this SDK, not
          # the runner's preinstalled one.
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"

      - name: Install SDK packages
        run: |
          SDK="$HOME/android-sdk"
          yes | sdkmanager --sdk_root="$SDK" --licenses > /dev/null
          # platform/build-tools/NDK/CMake mirror the Gradle pins so the
          # build never needs to auto-download anything; sdkmanager is a
          # no-op for pieces already restored from cache.
          sdkmanager --sdk_root="$SDK" \
            "platform-tools" \
            "emulator" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1" \
            "${{ matrix.system-image }}"

      - name: Create Android Virtual Device
        run: |
          echo no | avdmanager create avd \
            --name velmux-ci \
            --package "${{ matrix.system-image }}" \
            --device pixel_4

      - name: Boot the emulator
        run: |
          # Output MUST be redirected away from the step's pipes so the
          # background emulator survives into later steps.
          emulator -avd velmux-ci \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -accel on > /tmp/emulator.log 2>&1 &
          # Generous cold-boot budget: AOSP images can boot slowly.
          timeout 600 adb wait-for-device shell \
            'while [ -z "$(getprop sys.boot_completed)" ]; do sleep 1; done'
          adb devices -l
          # Let package manager settle before the first APK install.
          sleep 10

      - name: Build and install the debug app (Android backend only)
        working-directory: apps/mobile/android
        run: |
          # Deliberately NO -PvelmuxFFmpegPrefix: these tests validate the
          # Android MediaCodec backend on its own. Only the emulator's ABI
          # is built (-PvelmuxAbis=x86_64) to keep the native build fast.
          ./gradlew installDebug --stacktrace \
            -PvelmuxAbis=x86_64 -PreactNativeArchitectures=x86_64

      - name: Run instrumented tests
        working-directory: apps/mobile/android
        run: |
          ./gradlew connectedDebugAndroidTest --stacktrace \
            -PvelmuxAbis=x86_64 -PreactNativeArchitectures=x86_64

      # Diagnostics for any failure: device logcat, emulator stdout and the
      # instrumented-test XML reports.
      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p /tmp/velmux-diagnostics
          adb logcat -d > /tmp/velmux-diagnostics/logcat.txt 2>/dev/null || true
          cp /tmp/emulator.log /tmp/velmux-diagnostics/ 2>/dev/null || true
          cp -r apps/mobile/android/app/build/outputs/androidTest-results \
            /tmp/velmux-diagnostics/ 2>/dev/null || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: velmux-emulated-diagnostics-api${{ matrix.api-level }}
          path: /tmp/velmux-diagnostics
          if-no-files-found: ignore
