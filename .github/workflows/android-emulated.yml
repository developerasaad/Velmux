# Android instrumented tests on real emulators.
#
# The instrumented suite in platform/android/tests runs REAL MediaCodec conversions
# through the engine's JNI facade against fixtures generated on-device by
# real encoders, and validates outputs with an independent MediaExtractor
# probe. This workflow runs them on API 29 (the product floor) and a modern
# API level, both x86_64 google_apis images.
#
# Dumb executor: CI provides KVM, the emulator/system image (cached), the
# toolchain, and an identity-keyed FFmpeg cache; scripts/test.sh
# --android-emulator owns everything else (KVM permission fix, AVD
# creation, boot with timeout-wrapped polling, x86_64 app + FFmpeg build —
# FFmpeg is mandatory and identity-checked — cold-launch verification, the
# instrumented engine suite, and the relaunch check).
name: Android emulated

on:
  push:
    paths:
      - core/**
      - platform/**
      - ui/**
      - scripts/ffmpeg-builder/**
      # The scripts this workflow executes: test.sh --android-emulator
      # dispatches to scripts/android/emulator-test.sh, which builds the
      # app through scripts/android/build.sh (FFmpeg via scripts/ffmpeg/*)
      # and sources scripts/lib/*. (A scripts-only change must still
      # validate the emulated suite.)
      - scripts/test.sh
      - scripts/lib/**
      - scripts/ffmpeg/**
      - scripts/android/**
      - gradle.properties
      - settings.gradle.kts
      - .github/workflows/android-emulated.yml
  pull_request:
    paths:
      - core/**
      - platform/**
      - ui/**
      - scripts/ffmpeg-builder/**
      - scripts/test.sh
      - scripts/lib/**
      - scripts/ffmpeg/**
      - scripts/android/**
      - gradle.properties
      - settings.gradle.kts
      - .github/workflows/android-emulated.yml
  workflow_dispatch:

# One run per ref; a newer push supersedes the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  instrumented:
    name: Instrumented tests (API ${{ matrix.api-level }})
    # Pinned: ubuntu-latest became Ubuntu 26.04 in November 2026,
    # where the Android emulator (37.3.10) dies instantly at boot; the
    # 24.04 image is the validated environment (and keeps builds
    # reproducible against a moving label).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # google_apis images, not "default": the API 29 default image
          # hangs during headless boot on modern emulator builds (observed:
          # sys.boot_completed never set within 9 minutes with KVM working).
          # google_apis images are the CI-proven set; the same pins live in
          # scripts/lib/config.sh.
          - api-level: 29
            # Product floor: Android 10 / API 29 (docs/DECISIONS.md D-003).
            image: system-images;android-29;google_apis;x86_64
          - api-level: 34
            image: system-images;android-34;google_apis;x86_64
    env:
      ANDROID_AVD_HOME: /home/runner/.android/avd
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show KVM availability
        run: |
          echo "KVM device:"; ls -l /dev/kvm || true
          egrep -c '(vmx|svm)' /proc/cpuinfo || true

      - name: Install emulator runtime libraries
        run: |
          sudo apt-get update
          # Headless emulator runtime deps on ubuntu-24.04; libasound2 is
          # the transitional name for libasound2t64 there.
          sudo apt-get install -y libx11-6 libxcb1 libpulse0 libnss3
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2
          # FFmpeg build tools: the mandatory-FFmpeg policy makes the
          # suite resolve (and on a cache miss BUILD) the x86_64 FFmpeg
          # inline — dav1d needs meson, x265/zimg need cmake + ninja
          # (cmake is preinstalled), zimg's autogen needs libtool, and
          # nasm enables the x86 asm paths (dav1d/x264/x265).
          sudo apt-get install -y ninja-build meson pkg-config nasm libtool

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The test script auto-resolves the pinned NDK: it finds
      # $ANDROID_HOME/ndk/<pinned> or installs it through sdkmanager, which
      # lives in the preinstalled cmdline-tools (not on PATH by default).
      - name: Expose sdkmanager (NDK auto-install fallback)
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Locate Android SDK tools
        id: sdk
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"
          ls "$SDK"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)
          fi
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"
          "$SDKMANAGER" --version

      - name: Restore emulator and system image cache
        id: emu-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-${{ matrix.api-level }}
          key: android-emu-v1-${{ matrix.api-level }}-${{ runner.os }}

      - name: Install emulator and system image
        env:
          SDKMANAGER: ${{ steps.sdk.outputs.sdkmanager }}
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "emulator" "platform-tools" "${{ matrix.image }}" > /dev/null

      - name: Save emulator and system image cache
        if: steps.emu-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-${{ matrix.api-level }}
          key: android-emu-v1-${{ matrix.api-level }}-${{ runner.os }}

      - name: Compute FFmpeg artifact identity
        id: ffid
        run: |
          # The Android FFmpeg identity includes the resolved NDK revision;
          # resolve the NDK exactly the way the build scripts do so the
          # cache key can never disagree with the identity fetch.sh
          # verifies during the build.
          source scripts/lib/common.sh
          resolve_android_ndk
          echo "identity=$(bash scripts/ffmpeg/identity.sh android x86_64)" >> "$GITHUB_OUTPUT"

      - name: Restore FFmpeg artifacts
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          # Both the built x86_64 artifacts (the emulator's ABI) and the
          # downloaded source tarballs. The key is the exact identity the
          # scripts verify before reuse.
          path: |
            scripts/ffmpeg-builder/out/android
            scripts/ffmpeg-builder/downloads
          key: ffmpeg-android-x86_64-${{ steps.ffid.outputs.identity }}

      # The repository script owns everything: KVM permission fix, AVD
      # creation, emulator boot with timeout-wrapped polling, the x86_64
      # app + FFmpeg build (FFmpeg mandatory, identity-checked), install,
      # cold-launch + fatal-error-scan verification, the instrumented engine
      # suite, and the relaunch check.
      - name: Emulator suite (boot + app build + instrumented tests)
        id: emulator-suite
        env:
          # ubuntu-latest runners provide 4 vCPUs.
          VELMUX_FFMPEG_JOBS: 4
        run: ./scripts/test.sh --android-emulator --api ${{ matrix.api-level }}

      - name: Save FFmpeg artifacts
        # Save only after the suite succeeded and only when this run
        # actually built something (no exact cache hit), so a partial
        # output can never poison the cache. A lost cross-run cache race
        # only costs a later rebuild, hence continue-on-error.
        if: steps.emulator-suite.outcome == 'success' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            scripts/ffmpeg-builder/out/android
            scripts/ffmpeg-builder/downloads
          key: ffmpeg-android-x86_64-${{ steps.ffid.outputs.identity }}

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          export PATH="/usr/local/lib/android/sdk/platform-tools:$PATH"
          mkdir -p /tmp/diag
          # Bounded: a bugreport against a half-booted emulator can hang
          # indefinitely (observed eating 40 minutes of job time).
          timeout 90 adb bugreport /tmp/diag/bugreport.zip > /dev/null 2>&1 || true
          # The test script writes its own emulator log to
          # /tmp/velmux-emulator-*.log (mktemp pattern).
          cp /tmp/velmux-emulator-*.log /tmp/diag/ 2>/dev/null || true
          adb shell getprop > /tmp/diag/getprop.txt 2>/dev/null || true
          adb devices -l > /tmp/diag/devices.txt 2>/dev/null || true

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: velmux-android-emulated-api${{ matrix.api-level }}-diag
          # /tmp/diag (bounded bugreport, getprop, devices) plus the test
          # script's own emulator log and the gradle instrumented outputs.
          path: |
            /tmp/diag
            /tmp/velmux-emulator-*.log
            platform/android/host/build/outputs/androidTest-results/
            platform/android/host/build/reports/
          if-no-files-found: ignore
          retention-days: 7
