# Host CI for the shared C++ core and the FFmpeg backend.
#
# Thin orchestration (mandate §50 + the CI directive): checkout, toolchain,
# identity-keyed cache restore, script invocation, artifact upload. All
# build logic lives in the repository — ./scripts/test.sh resolves (or
# builds) the pinned host FFmpeg, configures CMake, builds every
# registered suite and runs ctest; scripts/ffmpeg/identity.sh supplies the
# exact cache key so "cache hit" and "artifact valid" can never disagree.
name: Core & FFmpeg backend (host)

on:
  push:
    paths:
      - core/**
      - platform/**
      - third_party/**
      - scripts/**
      - testdata/**
      - CMakeLists.txt
      - .github/workflows/core.yml
  pull_request:
    paths:
      - core/**
      - platform/**
      - third_party/**
      - scripts/**
      - testdata/**
      - CMakeLists.txt
      - .github/workflows/core.yml
  workflow_dispatch:

# One run per ref; a newer push supersedes the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host:
    name: Linux host build and tests
    # Pinned: ubuntu-latest became Ubuntu 26.04 in November 2026,
    # where the Android emulator (37.3.10) dies instantly at boot; the
    # 24.04 image is the validated environment (and keeps builds
    # reproducible against a moving label).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # meson: dav1d build system; pkg-config: FFmpeg configure probes;
          # libtool: zimg autogen (the builder builds a prefix-local
          # fallback itself when the host ships none).
          sudo apt-get install -y ninja-build libsqlite3-dev meson pkg-config libtool

      - name: Verify CMake toolchain
        run: |
          # CMake is preinstalled on GitHub-hosted runners; install it via pip
          # only if the image ever ships without it.
          if ! command -v cmake >/dev/null 2>&1; then
            python3 -m pip install cmake ninja
          fi
          cmake --version

      - name: Compute FFmpeg artifact identity
        id: ffid
        run: echo "identity=$(bash scripts/ffmpeg/identity.sh host)" >> "$GITHUB_OUTPUT"

      - name: Restore host FFmpeg cache
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          # Both the built host artifacts and the downloaded source tarballs.
          # The key is the exact identity the scripts verify before reuse.
          path: |
            scripts/ffmpeg-builder/out/host
            scripts/ffmpeg-builder/downloads
          key: ffmpeg-host-${{ steps.ffid.outputs.identity }}

      # The repository script owns everything: FFmpeg resolve/rebuild,
      # CMake configure, build, ctest. FFmpeg is mandatory — the script
      # fails loudly when it cannot be produced; there is no fallback.
      - name: Host suite (FFmpeg resolve + build + ctest)
        id: host-suite
        env:
          # ubuntu-latest runners provide 4 vCPUs.
          VELMUX_FFMPEG_JOBS: 4
        run: ./scripts/test.sh

      - name: Save host FFmpeg cache
        # Save only when the suite succeeded and this run actually built
        # something (no exact cache hit), so a partial output can never
        # poison the cache. A lost cross-run cache race only costs a later
        # rebuild, hence continue-on-error.
        if: steps.host-suite.outcome == 'success' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            scripts/ffmpeg-builder/out/host
            scripts/ffmpeg-builder/downloads
          key: ffmpeg-host-${{ steps.ffid.outputs.identity }}

      - name: Upload host FFmpeg artifact
        # The host prefix is a development/test artifact (spec §7). CI is
        # the canonical builder; uploading it lets local development
        # environments download and reuse the exact pinned prefix instead
        # of rebuilding it (the identity is platform-level, so the same
        # artifact validates on any Linux x86_64 host). Kept small by
        # excluding the downloaded tarball cache.
        if: steps.host-suite.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-host-${{ steps.ffid.outputs.identity }}
          path: scripts/ffmpeg-builder/out/host
          retention-days: 14
          if-no-files-found: error

      # Runs only when a .clang-format file exists at the repository root;
      # hashFiles returns an empty string otherwise and the step is skipped
      # silently. (A lint, not build logic — it stays in CI.)
      - name: clang-format check
        if: hashFiles('.clang-format') != ''
        run: |
          sudo apt-get install -y clang-format
          # Check every C/C++ source owned by the native layers. Directories
          # that do not exist are ignored so the step degrades gracefully.
          sources=$(find core platform -type f \
            \( -name '*.cpp' -o -name '*.cc' -o -name '*.cxx' \
            -o -name '*.h' -o -name '*.hpp' -o -name '*.hxx' \
            -o -name '*.mm' \) 2>/dev/null || true)
          if [ -n "$sources" ]; then
            # --Werror makes clang-format fail on any file it would rewrite.
            clang-format --dry-run --Werror $sources
          else
            echo "No C/C++ sources found; nothing to check."
          fi

      - name: Upload build and test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-build-logs
          # The host suite builds in build/host. Not every failure produces
          # logs; missing files are tolerated.
          path: |
            build/host/**/Testing/
            build/host/CMakeFiles/*.log
          if-no-files-found: ignore
          retention-days: 7

  sanitize:
    name: Host suite under ASan + UBSan
    # Same tree, separate job: the sanitizer build recompiles every suite
    # with -fsanitize=address,undefined and runs ctest instrumented. It
    # shares the identity-keyed FFmpeg cache with the regular host job
    # (the artifacts are the same; only the instrumented rebuild differs).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev meson pkg-config libtool

      - name: Verify CMake toolchain
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            python3 -m pip install cmake ninja
          fi
          cmake --version

      - name: Compute FFmpeg artifact identity
        id: ffid
        run: echo "identity=$(bash scripts/ffmpeg/identity.sh host)" >> "$GITHUB_OUTPUT"

      - name: Restore host FFmpeg cache
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            scripts/ffmpeg-builder/out/host
            scripts/ffmpeg-builder/downloads
          key: ffmpeg-host-${{ steps.ffid.outputs.identity }}

      # The repository script owns everything: same FFmpeg resolution, then
      # the sanitized configure/build/ctest cycle.
      - name: Sanitized host suite (ASan + UBSan, ctest)
        env:
          VELMUX_FFMPEG_JOBS: 4
        run: ./scripts/test.sh --sanitize

      - name: Upload sanitized build and test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-sanitize-logs
          path: |
            build/host-sanitize/**/Testing/
            build/host-sanitize/CMakeFiles/*.log
          if-no-files-found: ignore
          retention-days: 7
