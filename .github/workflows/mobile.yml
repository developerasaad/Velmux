# CI for the shared Kotlin Multiplatform / Compose Multiplatform UI.
#
# Thin orchestration: checkout, JDK, Gradle caching, script invocation.
# The suite logic lives in the repository — ./scripts/test.sh --ui runs
# :ui:mobile:jvmTest (the host verification target; the Android target
# compiles through the product build, the iOS targets through the macOS
# framework build).
name: Shared UI (Kotlin)

on:
  push:
    paths:
      - ui/**
      - platform/android/**
      - platform/ios/**
      - settings.gradle.kts
      - build.gradle.kts
      - gradle.properties
      - gradle/**
      - gradlew
      - gradlew.bat
      # The scripts this workflow executes: test.sh --ui dispatches to
      # scripts/lib/ui-suite.sh.
      - scripts/test.sh
      - scripts/lib/**
      - .github/workflows/mobile.yml
  pull_request:
    paths:
      - ui/**
      - platform/android/**
      - platform/ios/**
      - settings.gradle.kts
      - build.gradle.kts
      - gradle.properties
      - gradle/**
      - gradlew
      - gradlew.bat
      - scripts/test.sh
      - scripts/lib/**
      - .github/workflows/mobile.yml
  workflow_dispatch:

# One run per ref; a newer push supersedes the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jvm:
    name: Shared Kotlin compile and JVM tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle dependency and wrapper caching.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The repository script owns the suite: it locates the Gradle
      # wrapper, requires the JDK and runs :ui:mobile:jvmTest.
      - name: Shared UI suite
        run: ./scripts/test.sh --ui

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: ui/mobile/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
