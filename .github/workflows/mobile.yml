# CI for the React Native application (TypeScript only: type check + lint).
#
# Thin wrapper: ./scripts/test.sh --ts owns the logic (JS dependency install
# included). This workflow stays separate from core.yml because its trigger
# paths (apps/**, bridge/ts/**) are broader than core.yml's.
name: Mobile app (TS)

on:
  push:
    paths:
      - apps/**
      - bridge/ts/**
      - .github/workflows/mobile.yml
  pull_request:
    paths:
      - apps/**
      - bridge/ts/**
      - .github/workflows/mobile.yml
  workflow_dispatch:

# One run per ref; a newer push supersedes the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Type check and lint
    # Pinned: ubuntu-latest became Ubuntu 26.04 in November 2026,
    # where the Android emulator (37.3.10) dies instantly at boot; the
    # 24.04 image is the validated environment (and keeps builds
    # reproducible against a moving label).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: TypeScript suite
        run: ./scripts/test.sh --ts
